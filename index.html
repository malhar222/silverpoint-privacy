<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silverpoint</title>
<meta name="description" content="Silverpoint — sponsorship CRM for independent creators.">
<style>
:root {
  color-scheme: light dark;
  --bg: #F6F6F3; --surface: #FFFFFF; --ink: #141517; --muted: #6B7078; --rule: #E2E3E5;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141517; --surface: #1F2023; --ink: #F2F3F5; --muted: #A9AEB6; --rule: #2C2E32; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.6 "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 720px; margin: 0 auto; padding: 48px 20px 64px; }
nav { margin-bottom: 32px; font-size: 15px; }
nav a { color: var(--muted); text-decoration: none; margin-right: 16px; }
nav a:hover { color: var(--ink); }
h1 { font-weight: 700; font-size: 32px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
h2 { font-weight: 500; font-size: 20px; margin: 36px 0 8px; }
p, li { color: var(--ink); }
.muted, em { color: var(--muted); }
ul { padding-left: 22px; }
li { margin: 6px 0; }
a { color: var(--ink); text-underline-offset: 3px; }
.card {
  background: var(--surface); border-radius: 16px; padding: 20px 24px; margin: 24px 0;
  border: 1px solid var(--rule);
}
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
<nav><a href="./">Silverpoint</a><a href="./privacy/">Privacy</a><a href="./support/">Support</a></nav>
<h1>Silverpoint</h1>
<p class="muted">Sponsorship CRM for independent creators: track brand deals, send one-tap PDF invoices, and get paid faster.</p>
<div class="card">
  <p><a href="privacy/">Privacy Policy</a></p>
  <p><a href="support/">Support</a></p>
</div>

<footer>© Meshal Alharbi · Silverpoint</footer>
</main>
</body>
</html>
